# Integración continua de pyscan: estilo + pruebas + cobertura en cada push y pull request.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"
      - name: Estilo (isort, black, flake8)
        run: |
          isort --check-only src tests
          black --check src tests
          flake8 src tests
      - name: Pruebas y cobertura (mínimo 80 %)
        run: pytest --cov=pyscan --cov-report=term-missing --cov-fail-under=80
