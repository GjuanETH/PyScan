[project]
name = "pyscan"
version = "0.1.0"
description = "MVP de detección de paquetes maliciosos en PyPI mediante análisis estático y aprendizaje automático supervisado"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Andrés Felipe Sanguino Cubillos" },
    { name = "Juan David Gutiérrez Reyes" },
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "requests>=2.28",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "xgboost>=2.0", "pandas>=2.0", "numpy>=1.24", "imbalanced-learn>=0.11", "joblib>=1.3"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "flake8", "black", "mypy"]

[project.scripts]
pyscan = "pyscan.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100

[tool.coverage.run]
source = ["pyscan"]
